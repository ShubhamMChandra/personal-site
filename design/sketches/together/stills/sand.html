<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Still, sand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Schibsted+Grotesk:wght@400..700&display=swap">
<style>
/* layout: a still. The page is a dark bronze plate dusted with pale sand; as you move through, the plate sounds and the sand gathers on the lines that stay still */
:root { --plate: #26211d; --ink: #f1e8d8; --ink-soft: #b9ad9b; --link: #e2a03e; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--plate); color: var(--ink); overflow: hidden; }
body { font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
.page { position: relative; padding: 64px 28px 0; display: grid; gap: 1.15rem; }
.name { margin: 0; font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 500; font-size: 2.6rem; line-height: .98; letter-spacing: -.015em; }
.place { margin: .45rem 0 0; color: var(--ink-soft); }
.lead { margin: 0; font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-size: 1.36rem; line-height: 1.32; }
.links { display: flex; gap: 1.4rem; font-size: 1rem; }
.links a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--link); text-decoration-thickness: 1.5px; text-underline-offset: .28em; }
.gap { height: 330px; }
.prose { margin: 0; font-family: "Fraunces", Georgia, serif; font-variation-settings: "SOFT" 100; font-size: 1.08rem; line-height: 1.64; }
.words { position: relative; display: grid; gap: 1.15rem; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="page">
  <div class="words" data-quiet><header><h1 class="name">Shubham Chandra</h1><p class="place">Chicago</p></header>
  <p class="lead">I do better with things that take a little time to make sense of.</p>
  <div class="links"><a href="#">Email</a><a href="#">LinkedIn</a><a href="#">Curriculum vitae</a></div></div>
  <div class="gap"></div>
  <p class="prose" data-quiet>I’m drawn to interesting textures, small restaurants that don’t advertise themselves, and travel that doesn’t come with a gift shop.</p>
</div>
<script>
document.fonts.ready.then(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d')
  const W = innerWidth, H = innerHeight, D = 2, WD = W * D, HD = H * D
  cv.width = WD; cv.height = HD
  const after = location.hash === '#after'
  let seed = 77
  const R = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 }
  const hash = (i, j) => { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296 }
  const sm = t => t * t * (3 - 2 * t)
  const vn = (x, y) => { const i = Math.floor(x), j = Math.floor(y), fx = sm(x - i), fy = sm(y - j), a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1); return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy }

  // the plate: dark bronze, brushed, a little warmer where the lamp is
  const img = ctx.createImageData(WD, HD), px = img.data
  for (let py = 0; py < HD; py++) {
    for (let x = 0; x < WD; x++) {
      const o = (py * WD + x) * 4
      const brush = 0.94 + 0.06 * hash(Math.floor(x / 3), py) * 0.6 + 0.05 * vn(x / 400, py / 7)
      const lamp = 1 + 0.32 * Math.exp(-(((x / D - W * 0.78) / (W * 0.7)) ** 2 + ((py / D - H * 0.12) / (H * 0.55)) ** 2))
      px[o] = 38 * brush * lamp; px[o + 1] = 33 * brush * lamp; px[o + 2] = 29 * brush * lamp; px[o + 3] = 255
    }
  }

  // where the sand may sit: before, in loose drifts; after, on the lines of the plate that stay still
  const quiet = [...document.querySelectorAll('[data-quiet]')].map(el => el.getBoundingClientRect())
  const inQuiet = (x, y) => quiet.some(r => x > r.left - 10 && x < r.right + 10 && y > r.top - 12 && y < r.bottom + 12)
  // one figure, centred on the open space below his name: a ring round a four-petalled flower
  const g = document.querySelector('.gap').getBoundingClientRect(), yc = (g.top + g.bottom) / 2
  const chladni = (x, y) => { const u = (x - W / 2) / W * Math.PI, v = (y - yc) / W * Math.PI; return Math.cos(6 * u) * Math.cos(v) + Math.cos(u) * Math.cos(6 * v) }
  const density = (x, y) => {
    if (after) { const a = chladni(x, y); return Math.exp(-((a / 0.1) ** 2)) }
    const drift = sm(Math.min(1, Math.max(0, (vn(x / 90 + 4, y / 90 + 9) - 0.32) / 0.5)))
    const ripple = 0.55 + 0.45 * Math.sin((x * 0.28 + y * 0.96) / 3.2 + vn(x / 40, y / 40) * 5)
    return drift * ripple * 0.9
  }
  // the same sand in both: about ninety thousand grains, placed one by one
  const GRAINS = 90000
  let placed = 0, tries = 0
  const put = (x, y, r, g, b) => { if (x < 0 || y < 0 || x >= WD || y >= HD) return; const o = (y * WD + x) * 4; px[o] = r; px[o + 1] = g; px[o + 2] = b }
  while (placed < GRAINS && tries < GRAINS * 60) {
    tries++
    const x = R() * W, y = R() * H
    let dsy = density(x, y)
    if (inQuiet(x, y)) dsy *= 0.08
    if (R() > dsy) continue
    placed++
    const gx = Math.floor(x * D), gy = Math.floor(y * D)
    const t = R()
    const c = t < 0.7 ? [234, 222, 196] : t < 0.9 ? [214, 168, 96] : t < 0.97 ? [150, 128, 104] : [252, 246, 232]
    const k = 0.82 + R() * 0.24
    // each grain sits up off the plate: a shadow below right, a lit face, sometimes a glint
    put(gx + 1, gy + 1, 18, 15, 13)
    put(gx, gy, c[0] * k, c[1] * k, c[2] * k)
    if (R() < 0.45) put(gx + 1, gy, c[0] * k * 0.9, c[1] * k * 0.9, c[2] * k * 0.9)
    if (R() < 0.08) put(gx, gy - 1, 255, 250, 238)
  }
  ctx.putImageData(img, 0, 0)
  document.body.dataset.ready = '1'
})
</script>
</body>
</html>
