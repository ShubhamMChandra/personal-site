          I do better with things that take a little time to make sense of.

        <div class="personal-content">
          <p>
            I'm drawn to interesting textures, small restaurants that don't advertise themselves, and travel that doesn't come with a gift shop. I like being in places that aren't trying to perform for you. Street level feels honest: you're walking, noticing, adjusting. In Kerala, that's a fabric market, not a landmark. Heat, noise, color, bargaining, getting a little turned around and not minding it. I like the feeling of earning your way into a place.
          </p>
          <p>
            Back home, I pay attention to craft. Clothes are an easy example: weave, weight, hand feel, drape. I'm not interested in labels as a proxy for taste. I'm interested in the work. Cooking is the same impulse. Start with something solid, then tinker until it tastes like mine.
          </p>
          <p>
            I read a lot of sci-fi, especially the kind that starts fun and ends up making you stare at the ceiling for ten minutes. Consciousness, time, huge structures, weird rules. I like direct people and sharp conversation. I can be meticulous about what I care about and pretty relaxed about everything else.

        <p>
          This one is arranged as a small private library: five bound volumes
          on a single shelf, each holding one subject. The conceit is
          deliberately quiet: browsing, not performance. Everything a visitor
          needs sits on the shelf itself; the books are for readers who like
          to read.
        </p>
        <p>
          The type is set in Cormorant Garamond, with Space Grotesk and Space
          Mono for labels and figures. The palette keeps to a dark study
          (oxblood, slate, bottle green, mulberry, pewter), leathers that
          recede so the gilt can be scarce. Ornament is rationed on purpose.
        </p>
        <p>
          In fine printing, a colophon records how a book was produced: its
          typefaces, paper, and press. This page keeps that habit.
        </p>
