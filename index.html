  const TABS = [
    { id: 'work', label: 'Work', fam: ['#3a63b4', '#2f8d84', '#6f8fd0'], comp: '#e2a136',
      html: '<h2>Work</h2><ul class="roles"><li><span>Digital Realty</span><span class="when">2025–</span><span class="what">Go-to-market strategy and engineering</span></li><li><span>Advisory</span><span class="when">2022–</span><span class="what">Hedge funds on technology, startups on go-to-market</span></li><li><span>Garner Health</span><span class="when">2021–22</span><span class="what">Head of Business Operations. Joined at 38 people, left at 200.</span></li><li><span>NJOY</span><span class="when">2018–21</span><span class="what">Head of Strategy, Office of the CEO, through a $2.8B acquisition</span></li><li><span>L.E.K. Consulting</span><span class="when">2016–18</span><span class="what">Associate, fourteen engagements</span></li></ul>',
      more: '<h2>Work</h2><ul class="roles close"><li><span>Digital Realty</span><span class="when">2025–</span><span class="what">Go-to-market strategy and engineering.</span></li><li><span>Advisory</span><span class="when">2022–</span><span class="what">Research on AI and enterprise software for a $55B crossover fund, behind $400M of its decisions. Between, interim roles at A.Team and Better.com.</span></li><li><span>Garner Health</span><span class="when">2021–22</span><span class="what">The first operations hire. Built marketing and recruiting from nothing while the company grew five times over.</span></li><li><span>NJOY</span><span class="when">2018–21</span><span class="what">Strategy and fundraising in the CEO’s office: four rounds, a launch in eleven countries, then the $2.8B acquisition.</span></li><li><span>L.E.K. Consulting</span><span class="when">2016–18</span><span class="what">Growth strategy and private-equity diligence, for investors making eight- and nine-figure decisions.</span></li></ul>' },
    { id: 'me', label: 'Me', fam: ['#e2a136', '#e27a3a', '#eac34a'], comp: '#3a63b4',
      html: '<p>Go-to-market strategy and engineering at Digital Realty. I live in Chicago, and still advise a few funds and startups.</p><p class="lead">I do better with things that take a little time to make sense of.</p><p>Small restaurants that don’t advertise themselves. Clothes for their weave and drape. Cooking until it tastes like mine. A lot of sci-fi.</p>',
      more: '<p class="lead">I do better with things that take a little time to make sense of.</p><p>I like places that aren’t trying to perform for you. In Kerala, that’s a fabric market, not a landmark: heat, noise, colour, bargaining, getting a little turned around and not minding it.</p><p>At home it’s craft. Clothes are the easy example: weave, weight, hand feel, drape. Cooking is the same impulse. Start with something solid, then tinker until it tastes like mine.</p><p>I read sci-fi that starts fun and ends with me staring at the ceiling. And after years of writing specs, I learned to write the code: a master’s in computer science at UChicago, finished in 2025.</p>' },

    { id: 'references', label: 'References', fam: ['#7a5bb0', '#3a63b4', '#dc6a84'], comp: '#eac34a',

      more: '<h2>References</h2><blockquote><p>“He makes connections across disciplines, learns with incredible speed, and improves most things that enter his sphere. More importantly, he makes people around him better.”</p><footer>Geremy Bass, friend of ten years, former interim CPO at Zoho</footer></blockquote><blockquote><p>“His innate curiosity, tenacity and structured thinking allowed him to become a key contributor in our early strategy and capital raising initiatives.”</p><footer>Greg Doyle, former CFO, NJOY</footer></blockquote><blockquote><p>“He brought an incredible sense of quiet confidence to every meeting and every project.”</p><footer>Stephanie Fogle, CHRO, Parsley Health</footer></blockquote>' },
    { id: 'why', label: 'Why?', fam: ['#2f8d84', '#5f9a6e', '#eac34a'], comp: '#d4532f',
      html: '<h2>Why?</h2><p>When I was 12, <a href="https://en.wikipedia.org/wiki/StumbleUpon" target="_blank" rel="noopener">StumbleUpon</a> was my front door to the internet. I kept hitting refresh and found an internet full of art: unmonetized, unglamorous, built by enthusiasts, for enthusiasts. It sparked wonder.</p><p>When I was 17, my college gave us free admission to the Art Institute of Chicago, where Seurat’s <a href="https://www.artic.edu/artworks/27992/a-sunday-on-la-grande-jatte-1884" target="_blank" rel="noopener"><i>A Sunday on La Grande Jatte</i></a> hung. Over the years I spent hours in front of it, inspecting every stroke.</p><p>Everything we do is art. This site brings those two loves together: every pixel here is a little of who I am.</p><p>I appreciate you, for visiting, and for every pixelated brushstroke that makes you unique.</p><p class="fin">fin.</p>',
      more: '<h2>How it’s made</h2><p>The paint starts in the letters of the word you touch. Some of their strokes run out as currents, and every other current is laid beside one already there, so the page grows out of the word. Each current is one drag of a loaded brush that runs dry and is reloaded.</p><p>Each part bursts its own way: a sunburst, a wake, a fan, a galaxy, a weave. No two visits paint the same picture.</p><p>Set in Source Serif 4 and Schibsted Grotesk. Written by hand in HTML, CSS and JavaScript, with no framework.</p>' }

  // a stroke is never quite the same twice: width, edges, how it lands and how it ends

    let kind = Math.random()

        : kind < 0.88 ? u => (0.45 + 0.55 * Math.min(1, u / 0.8)) * (u > 0.85 ? 1 - (u - 0.85) / 0.15 * 0.7 : 1)

    const body = new Path2D()

        for (let i = 0; i <= 6; i++) { const u = 0.68 + (endU - 0.68) * i / 6; pts.push([-len / 2 + u * len, mid(u) + v * wd / 2 * (1 + 0.5 * (u - 0.68)), fw * (1 - i / 6.5)]) }

        for (let i = pts.length - 1; i >= 0; i--) body.lineTo(pts[i][0], pts[i][1] + pts[i][2] / 2); body.closePath()

    const c = Math.cos(a), s = Math.sin(a)
    if (!tx) { ctx.setTransform(dpr * c, dpr * s, -dpr * s, dpr * c, dpr * (x + 1.2), dpr * (y + 1.4)); ctx.fillStyle = css(mix(col, [58, 42, 30], 0.3), 0.24 * al); ctx.fill(sh) }

      for (const q of tex.streaks) {
        const r = Math.random()
        q.col = r < 0.38 ? mix(col, LIGHT, rnd(0.14, 0.22) * k2) : r < 0.72 ? mix(col, DEEP, rnd(0.12, 0.2) * k2) : nb
        q.al = rnd(0.7, 0.95)
      }
      tex.hiCol = mix(col, LIGHT, 0.6); tex.loCol = mix(col, DEEP, 0.55); tex.ridge = rnd(0.25, 0.4) * k2
      const item = { x: mx, y: my, a, len, wd, col, al, sh: body, tex, hy: by + wd * 1.2, bx0, t, dur, k: 0, L: null }
      if (over) {
        const dk = mix(col, [44, 32, 24], 0.62)
        for (const p of turn) tex.streaks.push({ p, col: dk, al: 0.3 * (1 - 0.8 * quiet) })
        // the float's small shadow on the weft it lies across: laid first, and dry first
        out.push({ ...item, x: mx + 1.2, y: my + 1.6, col: [46, 34, 26], al: 0.22 * al * (1 - 0.8 * quiet), tex: { streaks: [] }, t: t - 0.001, dur: dur * 0.7 })
      }
      out.push(item)
    }
    const wovenRun = (ln, pts) => {
      const n = pts.length, sp = WV.sp, lseed = Math.random() * 50
      const mid = pts[n >> 1], jL = Math.floor(cloth(mid[0], mid[1])[0] / sp)
      const over = pts.map(p => ((Math.floor(cloth(p[0], p[1])[1] / sp) + jL) % 2 + 2) % 2 === 1)
      const colAt = (p, arc) => {
        const cp = clamp(ln.ci + 0.5 * (bHue(p[0], p[1]) + 1.4 * (vnoise(lseed + arc / 300, 3.3) - 0.5)), 1.9, 3)
        let c1 = seqAt(cp), c2 = seqAt(clamp(cp - rnd(0.35, 0.6), 1.9, 3))
        if (ln.rust) { c1 = mix(comp, c1, 0.15); c2 = mix(comp, c2, 0.4) }
        const val = rnd(-1, 1) * 0.09; c1 = val > 0 ? mix(c1, PALE, val) : mix(c1, DEEP, -val * 0.8)
        const quiet = clamp(1 - (colDist(p[0], p[1]) + rnd(-14, 14)) / 56), fin = c => mix(mute(c, 0.2), PALE, 0.84 * quiet)
        return [fin(c1), mix(fin(c2), fin(c1), 0.35), 0.94 - 0.12 * quiet, quiet]
      }
      // each stretch of the thread is either over the weft (a float, laid after the weft is dry) or under it (a thin
      // dark run, laid just before the weft that covers it, seen only in the gaps between weft threads). Both only where
      // a weft thread actually crosses, so the cloth's ragged edge frays rather than scattering loose pieces
      const hasWeft = q => { const k = cellOf(q[0], q[1]); return k >= 0 && k < tS.length && tS[k] < Infinity }
      for (let i = 0; i < n;) {
        let j = i; while (j + 1 < n && over[j + 1] === over[i]) j++
        const seg = pts.slice(Math.max(0, i - 1), Math.min(n, j + 2))
        if (seg.length >= 3 && seg.some(hasWeft)) {
          const [c1, c2, al, quiet] = colAt(seg[seg.length >> 1], i * 3)
          if (over[i]) weavePiece(seg, sp * rnd(0.36, 0.42), c1, c2, al, quiet, wvNear(seg, tE, Math.max, -Infinity) + 0.03, rnd(160, 240), true)
          else if (B.weaveUnder) {
            // laid just before the weft thread that crosses right here, not the earliest one nearby, so it doesn't show early
            const tu = seg.reduce((r, q) => { const k = cellOf(q[0], q[1]); return k >= 0 && k < tS.length ? Math.min(r, tS[k]) : r }, Infinity)
            const dk = c => mix(c, [38, 28, 22], 0.45 * (1 - 0.8 * quiet)); weavePiece(seg, sp * 0.2, dk(c1), dk(c2), al, quiet, tu - 0.02, 90, false)
          }
        }
        i = j + 1
      }
    }
    const warpRun = (ln, pts, tm, src) => {
      const n = pts.length, woven = pts.map(p => weaveField(p[0], p[1], 1).sw < 0.35 && wvNear([p], tS, Math.min, Infinity) < Infinity)
      for (let i = 0; i < n - 1;) {
        let j = i; while (j + 1 < n && woven[j + 1] === woven[i]) j++
        const sub = pts.slice(i, j + 2), subT = tm.slice(i, j + 2)
        if (sub.length >= 3) { if (woven[i]) wovenRun(ln, sub); else run(ln, sub, subT, src && i === 0) }
        i = j + 1
      }
    }
    const runL = (ln, pts, tm, src) => B.weave && ln.fm ? warpRun(ln, pts, tm, src) : run(ln, pts, tm, src)
    // ── end weave ──
    // weave: all the weft first, so the warp knows where and when it lies
    let nRun = 0
    for (const ln of B.weave ? [...lines.filter(l => !l.fm), ...lines.filter(l => l.fm)] : lines) {
      if ((nRun++ & 7) === 0) yield
      if (ln.gen === 0) {
        // the current runs out of the letter from its edge; the letter itself is not repainted, so it keeps its form
        runL(ln, ln.pts, ln.tm, true)
        // and a little paint flicks off the end of the longer ones
        if (ln.pts.length > 50) {
          const e = ln.pts[ln.pts.length - 1], q = ln.pts[ln.pts.length - 4], ha = Math.atan2(e[1] - q[1], e[0] - q[0])
          for (let k = 0, n = 1 + Math.floor(Math.random() * 3); k < n; k++) {
            const da = ha + rnd(-0.5, 0.5), dd = rnd(10, 30)
            out.push({ x: e[0] + Math.cos(da) * dd, y: e[1] + Math.sin(da) * dd, a: da + rnd(-0.3, 0.3), len: rnd(5, 13), wd: rnd(2.2, 4.2), col: mute(pick(seq), 0.1), al: 0.9, t: remap(ln.tm[ln.tm.length - 1]) + rnd(0.05, 0.3), dur: 160 })
          }
        }
      } else {
        runL(ln, ln.pts.slice(ln.si), ln.tm.slice(ln.si), false)
        if (ln.si > 1) runL(ln, ln.pts.slice(0, ln.si + 1).reverse(), ln.tm.slice(0, ln.si + 1).reverse(), false)
      }
    }
    // a budget of rule-breaks: two or three things a painter does once, on purpose, and never twice
    const recolour = (m, c) => { const tx = m.tex ? { ...m.tex, streaks: m.tex.streaks.map(q => ({ ...q, col: mix(q.col, c, 0.65) })), hiCol: mix(c, LIGHT, 0.6), loCol: mix(c, DEEP, 0.55) } : null; return { ...m, col: c, tex: tx } }
    const open = out.filter(m => !m.L && m.tex && m.al > 0.86)
    const breaks = ['cross', 'correct', 'comp'].sort(() => Math.random() - 0.5).slice(0, (Math.random() < 0.4 ? 3 : 2) - (jumbo ? 1 : 0))
    if (open.length > 20 && reach >= 1 && !B.weave) for (const kind of breaks) {
      const m0 = pick(open)
      if (kind === 'cross') {
        // a small bundle laid straight across the current
        const n = 5 + Math.floor(Math.random() * 4), ac = m0.a + Math.PI / 2 + rnd(-0.25, 0.25), c = pick(seq), sp = m0.wd * 0.95
        for (let k = 0; k < n; k++) { const d = (k - n / 2) * sp; out.push({ x: m0.x + Math.cos(m0.a) * d, y: m0.y + Math.sin(m0.a) * d, a: ac + rnd(-0.08, 0.08), len: rnd(20, 34), wd: m0.wd * rnd(0.8, 1), col: mute(mix(c, LIGHT, rnd(0, 0.15)), 0.15), al: 0.95, t: m0.t + 0.5 + k * 0.05, dur: 260 }) }
      } else if (kind === 'correct') {
        // a patch the painter went back to and repainted in another colour, once the rest had dried
        const r = rnd(45, 75), c = seq[Math.floor(Math.random() * 4)]
        for (const m of open) if (Math.hypot(m.x - m0.x, m.y - m0.y) < r * (0.75 + 0.5 * vnoise(m.x / 30, m.y / 30))) out.push({ ...recolour(m, mix(c, m.col, rnd(0.15, 0.35))), x: m.x + rnd(-3, 3), y: m.y + rnd(-3, 3), t: Math.min(7.6, 6.3 + rnd(0, 0.9)) })
      } else {
        // the complementary colour, a few strokes of it, somewhere it has no business being
        const near = open.filter(m => Math.hypot(m.x - m0.x, m.y - m0.y) < 60).slice(0, 2 + Math.floor(Math.random() * 3))
        for (const m of near) out.push({ ...recolour(m, mix(comp, LIGHT, rnd(0, 0.12))), t: m.t + 0.02 })
      }
    }
    // even pacing: past the burst, strokes keep the order the plan gives them but arrive evenly spread in time,
    // easing off toward the end, so nothing piles up in the last second
    const late = out.filter(m => m.t > tb).sort((m, k) => m.t - k.t), TE = 7.6 * reachK
    if (!B.weave) late.forEach((m, r) => { m.t = tb + (TE - tb) * Math.pow((r + 1) / late.length, 1.15) })
    out.sort((m, k) => m.t - k.t)
    const nSrc = lines.filter(l => l.gen === 0).length
    out.stats = { sources: nSrc, tried: srcs.length, lines: lines.length, strokes: out.length, maxGen: Math.max(...lines.map(l => l.gen)), why, breaks: breaks.concat(jumbo ? ['jumbo'] : []), firstThird: out.filter(m => m.t <= tb).length / out.length, tEnd: out.length ? out[out.length - 1].t : 0 }
    if (sink) sink(out); else startPlan(out)
  }

  let wet = []
  function commit (m) { if (m.L) paint(m.L.fxc, m.x - m.L.nx, m.y - m.L.ny, m.a, m.sh, m.col, m.al, m.wd, m.tex); else paint(g, m.x, m.y, m.a, m.sh, m.col, m.al, m.wd, m.tex) }
  function stepQueue (now) {
    const el = reduce ? 1e9 : (now - queue.t0) / 1000
    while (queue.i < queue.length && queue[queue.i].t <= el) {
      const m = queue[queue.i++]
      m.sh = m.sh || shapeFor(m.len + m.wd * 0.4, m.wd * 1.15, m.k ?? rnd(-0.16, 0.16), true); m.born = now
      if (reduce) commit(m); else wet.push(m)
    }
    if (queue.i >= queue.length) queue = []
  }
  // the brush moving: each stroke grows from where it landed toward its tail, fading in as it goes
  function drawWet (now) {
    e2.setTransform(1, 0, 0, 1, 0, 0); e2.clearRect(0, 0, ec.width, ec.height)
    for (let i = wet.length - 1; i >= 0; i--) {
      const m = wet[i], p = Math.min(1, (now - m.born) / m.dur)
      if (p >= 1) { commit(m); wet.splice(i, 1); continue }
      const e = 1 - Math.pow(1 - p, 2.2), L2 = m.len + m.wd * 0.6, c = Math.cos(m.a), sn = Math.sin(m.a)
      e2.save()
      e2.setTransform(dpr * c, dpr * sn, -dpr * sn, dpr * c, dpr * m.x, dpr * m.y)
      const x0 = Math.min(-L2 / 2, m.bx0 ?? 0) - m.wd, hy = m.hy || m.wd * 2.5
      e2.beginPath(); e2.rect(x0, -hy, (L2 / 2 + m.wd - x0) * e, hy * 2); e2.clip()
      e2.globalAlpha = Math.min(1, p * 2.2)
      paint(e2, m.x, m.y, m.a, m.sh, m.col, m.al, m.wd, m.tex)
      e2.restore()
    }
  }

  // two depths: the first touch shows a glance; the word stays wet, glinting now and then, because there is more in it.
  // Touch it again for the closer look, painted with a smaller burst from the same word; then the word dries
  let depth = 0
  const textOf = (t, d) => d && t.more ? t.more : t.html
  function showPanel (t) { panel.innerHTML = textOf(t, depth); panel.classList.toggle('deep', depth === 1); fitPanel() }
  // the text always fits on one screen: it steps down a little in size if it would run into the painted words
  function fitPanel () {
    const limit = wide ? innerHeight - 24 : Math.min(...labels.map(l => l.y)) - 10
    let k = 1; panel.style.setProperty('--fit', 1)
    const floor = innerHeight < 720 ? 0.72 : 0.78
    while (panel.getBoundingClientRect().bottom > limit && k > floor) { k -= 0.03; panel.style.setProperty('--fit', k) }
  }
  function choose (t) {
    const L = labels.find(l => l.t === t)
    labels.forEach(l => l.button.setAttribute('aria-pressed', l.t === t ? 'true' : 'false'))
    L.burst = 1
    for (const l of labels) if (l !== L && l.fxUsed) { l.fxUsed = false; l.fx.style.opacity = 0; setTimeout(() => { l.fxc.setTransform(1, 0, 0, 1, 0, 0); l.fxc.clearRect(0, 0, l.fx.width, l.fx.height); l.fx.style.opacity = 1 }, 1700) }
    L.fxUsed = true
    if (!reduce) for (const c of [L.cv, L.fx]) c.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.045) rotate(-0.6deg)' }, { transform: 'scale(1)' }], { duration: 560, easing: 'cubic-bezier(.3,1.5,.5,1)' })
    const again = t === current && L.full
    L.full = true
    depth = again && t.more ? 1 - depth : 0
    L.glintAt = performance.now() + 2600
    measureText(t)
    if (!again || t.more) {
      current = t
      try { history.replaceState(null, '', '#' + t.id) } catch (e) {}
      panel.classList.add('out')
      setTimeout(() => { showPanel(t); panel.classList.remove('out') }, reduce ? 0 : 520)
    }
    swirl(L, again ? 0.55 : 1)
  }

  // the words' own footprint: the header and the part's text, as they will stand once it has changed
  function measureText (t) {
    const keep = panel.innerHTML, keepDeep = panel.classList.contains('deep'), keepFit = panel.style.getPropertyValue('--fit')
    if (t) { panel.innerHTML = textOf(t, depth); panel.classList.toggle('deep', depth === 1); fitPanel() }
    const a = document.querySelector('.text header').getBoundingClientRect(), b = panel.getBoundingClientRect()
    if (t) { panel.innerHTML = keep; panel.classList.toggle('deep', keepDeep); panel.style.setProperty('--fit', keepFit || 1) }
    textBox = { x0: Math.min(a.left, b.left) - 16, y0: a.top - 14, x1: Math.max(a.right, b.right) + 16, y1: b.bottom + 14 }
  }

  // where the words go, whichever section is open: the largest area any section's text takes, at either depth
  let textCol = null
  function measureColumn () {
    // the text is centred, so a longer text moves the name up: take the extremes over every section and depth
    const keep = depth, head = document.querySelector('.text header')
    let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0
    for (const t of TABS) for (const d of [0, 1]) {
      depth = d; panel.innerHTML = textOf(t, d); panel.classList.toggle('deep', d === 1); fitPanel()
      const hd = head.getBoundingClientRect(), b = panel.getBoundingClientRect()
      x0 = Math.min(x0, hd.left, b.left); y0 = Math.min(y0, hd.top); x1 = Math.max(x1, hd.right, b.right); y1 = Math.max(y1, b.bottom)
    }
    depth = keep
    textCol = { x0: x0 - 18, y0: y0 - 16, x1: x1 + 18, y1: y1 + 16 }
  }
  const colDist = (x, y) => textCol ? Math.hypot(Math.max(textCol.x0 - x, 0, x - textCol.x1), Math.max(textCol.y0 - y, 0, y - textCol.y1)) : 1e9
  async function build () {
    for (const k in plans) delete plans[k]
    planner = null
    W = innerWidth; H = innerHeight; wide = W > 760
    for (const c of [gc, wc, ec]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr) }
    // the words to read come first; the painted words follow as soon as they are built
    if (!labels.length) showPanel(current)
    await writeWords()
    measureColumn()
    layGround()
    primeColumn()
    showPanel(current)
    measureText()
    drawWords()
  }

  addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY }, { passive: true })
  addEventListener('pointerdown', e => { pointer.x = e.clientX; pointer.y = e.clientY }, { passive: true })
  // a finger doesn't hover: once it lifts, nothing stays lit for being near where it was
  const unhover = e => { if (e.pointerType !== 'mouse') { pointer.x = -1e4; pointer.y = -1e4 } }
  addEventListener('pointerup', unhover, { passive: true }); addEventListener('pointercancel', unhover, { passive: true })
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 200) })

  await build()
  // on arrival, the first word unfolds a small swirl by itself, to show what the words do
  if (!STILL) setTimeout(() => { const L = labels.find(l => l.t === current); L.burst = 1; L.fxUsed = true; L.glintAt = performance.now() + 2600; swirl(L, 0.45) }, reduce ? 0 : 1300)

  let lastPulse = performance.now(), pulsing = null
  function frame (now) {
    // the words breathe: now and then one warms a little on its own, so you can tell they answer
    if (!reduce && now - lastPulse > 3400) { lastPulse = now; pulsing = { L: pick(labels), until: now + 1300 } }
    let changed = false
    for (const L of labels) {
      const dx = Math.max(L.x - pointer.x, 0, pointer.x - (L.x + L.w)), dy = Math.max(L.y - pointer.y, 0, pointer.y - (L.y + L.h))
      let tgt = clamp(1 - Math.hypot(dx, dy) / (wide ? 200 : 120))
      if (L.focus) tgt = 1
      if (L.t === current) tgt = Math.max(tgt, 0.5)
      if (pulsing && pulsing.L === L && now < pulsing.until) tgt = Math.max(tgt, 0.38)
      // wet: the chosen word glints while there is a closer look to have
      const wet = !reduce && L.t === current && depth === 0 && L.t.more && L.burst === 0 && L.glintAt
      const gph = wet ? (now - L.glintAt) % 4200 : 1e9, g = gph < 1100 ? -0.25 + 1.5 * ease(gph / 1100) : null
      if (g !== L.glint) { if (g !== null || L.glint != null) L.dirty = true; L.glint = g }
      if (L.burst > 0) { tgt = 1; L.burst *= 0.985; if (L.burst < 0.3) L.burst = 0 }
      const np = L.p + (tgt - L.p) * (reduce ? 1 : 0.07)
      if (Math.abs(np - L.p) > 0.002) L.dirty = true
      L.p = np
    }
    for (const L of labels) if (L.dirty) { drawLabel(L); L.dirty = false }
    if (building) stepBuild()
    else if (!STILL && !queue.length && !wet.length) stepPlanner()
    if (queue.length && !STILL) stepQueue(now)
    if (wet.length || ec.dirty) { drawWet(now); ec.dirty = wet.length > 0 }
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
  window.__painted = { choose: id => choose(TABS.find(t => t.id === id)), settle: () => { if (queue.length) { queue.t0 = -1e12; stepQueue(performance.now()) } for (const m of wet) m.born = -1e9; drawWet(performance.now()) }, labels: () => labels.length,
    at: T => { while (queue.i < queue.length && queue[queue.i].t <= T) { const m = queue[queue.i++]; m.sh = m.sh || shapeFor(m.len + m.wd * 0.4, m.wd * 1.15, m.k ?? 0, true); commit(m) } },
    stats: () => queue.stats }
})()
</script>
