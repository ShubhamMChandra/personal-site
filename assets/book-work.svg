<!--
  book-work.svg - Work Book Spine
  WHAT: Aged oxblood tooled-leather spine, embossed bands, beveled gold-foil "WORK"
  WHY:  Visual asset for Work book on the bookshelf
-->
<svg xmlns="http://www.w3.org/2000/svg" width="65" height="320" viewBox="0 0 65 320">
  <defs>
    <!-- Leather vertical: lit from above -->
    <linearGradient id="leatherV-work" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e2a2c"/>
      <stop offset="45%" stop-color="#5a1e22"/>
      <stop offset="100%" stop-color="#2b0d0f"/>
    </linearGradient>
    <!-- Leather horizontal: cylindrical roundness -->
    <linearGradient id="leatherH-work" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b0d0f"/>
      <stop offset="50%" stop-color="#6e2a2c"/>
      <stop offset="100%" stop-color="#2b0d0f"/>
    </linearGradient>
    <!-- Cylindrical shadow -->
    <linearGradient id="cyl-work" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="18%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="82%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.28)"/>
    </linearGradient>
    <!-- Gold foil -->
    <linearGradient id="foil-work" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4e1f"/>
      <stop offset="30%" stop-color="#b98a3e"/>
      <stop offset="50%" stop-color="#f4dd97"/>
      <stop offset="70%" stop-color="#c99a48"/>
      <stop offset="100%" stop-color="#6b4e1f"/>
    </linearGradient>
    <!-- Grain -->
    <filter id="grain-work" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.4" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="d"/>
      <feComponentTransfer in="d" result="a">
        <feFuncA type="linear" slope="0.06" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <!-- Edge-wear vignette -->
    <radialGradient id="vig-work" cx="50%" cy="8%" r="115%">
      <stop offset="0%" stop-color="rgba(255,225,190,0.14)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>
  </defs>

  <!-- L1 leather base -->
  <rect width="65" height="320" fill="url(#leatherV-work)" rx="2"/>
  <rect width="65" height="320" fill="url(#leatherH-work)" rx="2" opacity="0.45"/>
  <!-- L2 grain -->
  <rect width="65" height="320" filter="url(#grain-work)" opacity="0.5" rx="2"/>
  <!-- L3 cylindrical shadow -->
  <rect width="65" height="320" fill="url(#cyl-work)" rx="2"/>

  <!-- L4 embossed bands (top pair) -->
  <g>
    <rect x="6" y="42" width="53" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="6" y="39" width="53" height="3.5" fill="#6e2a2c"/>
    <rect x="6" y="38.4" width="53" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="6" y="55" width="53" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="6" y="52" width="53" height="3.5" fill="#6e2a2c"/>
    <rect x="6" y="51.4" width="53" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <!-- bottom pair -->
  <g>
    <rect x="6" y="268" width="53" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="6" y="265" width="53" height="3.5" fill="#6e2a2c"/>
    <rect x="6" y="264.4" width="53" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="6" y="281" width="53" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="6" y="278" width="53" height="3.5" fill="#6e2a2c"/>
    <rect x="6" y="277.4" width="53" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>

  <!-- L5 gold-foil title WORK -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="1">
    <g fill="#000" opacity="0.55">
      <text x="33.1" y="112.6">W</text>
      <text x="33.1" y="146.6">O</text>
      <text x="33.1" y="180.6">R</text>
      <text x="33.1" y="214.6">K</text>
    </g>
    <g fill="url(#foil-work)">
      <text x="32.5" y="112">W</text>
      <text x="32.5" y="146">O</text>
      <text x="32.5" y="180">R</text>
      <text x="32.5" y="214">K</text>
    </g>
  </g>

  <!-- L6 ornament: hollow quatrefoil -->
  <g transform="translate(32.5,244)" fill="none" stroke="url(#foil-work)" stroke-width="0.9" opacity="0.55">
    <circle cx="0" cy="-4.5" r="4.5"/>
    <circle cx="0" cy="4.5" r="4.5"/>
    <circle cx="-4.5" cy="0" r="4.5"/>
    <circle cx="4.5" cy="0" r="4.5"/>
  </g>

  <!-- L7 vignette -->
  <rect width="65" height="320" fill="url(#vig-work)" rx="2"/>
</svg>
