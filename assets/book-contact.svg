<!--
  book-contact.svg - Contact Book Spine
  WHAT: Aged forest-green tooled-leather spine, embossed bands, beveled warm-brass "CONTACT"
  WHY:  Visual asset for Contact book on the bookshelf
-->
<svg xmlns="http://www.w3.org/2000/svg" width="52" height="260" viewBox="0 0 52 260">
  <defs>
    <linearGradient id="leatherV-contact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21402d"/>
      <stop offset="45%" stop-color="#1a3325"/>
      <stop offset="100%" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="leatherH-contact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2419"/>
      <stop offset="50%" stop-color="#21402d"/>
      <stop offset="100%" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="cyl-contact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="18%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="82%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.28)"/>
    </linearGradient>
    <!-- Warm brass foil -->
    <linearGradient id="foil-contact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b531f"/>
      <stop offset="30%" stop-color="#b8963e"/>
      <stop offset="50%" stop-color="#e0c07a"/>
      <stop offset="70%" stop-color="#c0a048"/>
      <stop offset="100%" stop-color="#6b531f"/>
    </linearGradient>
    <filter id="grain-contact" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.4" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="d"/>
      <feComponentTransfer in="d" result="a">
        <feFuncA type="linear" slope="0.06" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="vig-contact" cx="50%" cy="8%" r="115%">
      <stop offset="0%" stop-color="rgba(255,225,190,0.14)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>
  </defs>

  <rect width="52" height="260" fill="url(#leatherV-contact)" rx="2"/>
  <rect width="52" height="260" fill="url(#leatherH-contact)" rx="2" opacity="0.45"/>
  <rect width="52" height="260" filter="url(#grain-contact)" opacity="0.5" rx="2"/>
  <rect width="52" height="260" fill="url(#cyl-contact)" rx="2"/>

  <!-- top band pair -->
  <g>
    <rect x="4" y="34" width="44" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="4" y="31" width="44" height="3.5" fill="#254a33"/>
    <rect x="4" y="30.4" width="44" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="4" y="46" width="44" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="4" y="43" width="44" height="3.5" fill="#254a33"/>
    <rect x="4" y="42.4" width="44" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <!-- bottom band pair -->
  <g>
    <rect x="4" y="216" width="44" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="4" y="213" width="44" height="3.5" fill="#254a33"/>
    <rect x="4" y="212.4" width="44" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="4" y="228" width="44" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="4" y="225" width="44" height="3.5" fill="#254a33"/>
    <rect x="4" y="224.4" width="44" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>

  <!-- title CONTACT -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    <g fill="#000" opacity="0.55">
      <text x="26.6" y="82.6">C</text>
      <text x="26.6" y="103.6">O</text>
      <text x="26.6" y="124.6">N</text>
      <text x="26.6" y="145.6">T</text>
      <text x="26.6" y="166.6">A</text>
      <text x="26.6" y="187.6">C</text>
      <text x="26.6" y="208.6">T</text>
    </g>
    <g fill="url(#foil-contact)">
      <text x="26" y="82">C</text>
      <text x="26" y="103">O</text>
      <text x="26" y="124">N</text>
      <text x="26" y="145">T</text>
      <text x="26" y="166">A</text>
      <text x="26" y="187">C</text>
      <text x="26" y="208">T</text>
    </g>
  </g>

  <!-- ornament: single laurel leaf (one stroke), tilted, between top bands and title -->
  <g transform="rotate(18 26 61)" stroke="url(#foil-contact)" opacity="0.55" fill="none">
    <path d="M26 53 C30 57 30 65 26 69 C22 65 22 57 26 53 Z" stroke-width="0.9"/>
    <line x1="26" y1="54.5" x2="26" y2="67.5" stroke-width="0.55" opacity="0.8"/>
  </g>

  <rect width="52" height="260" fill="url(#vig-contact)" rx="2"/>
</svg>
