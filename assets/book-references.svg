<!--
  book-references.svg - References Book Spine
  WHAT: Aged deep-aubergine tooled-leather spine, embossed bands, beveled gold-foil "REFERENCES"
  WHY:  Visual asset for testimonials/quotes book
-->
<svg xmlns="http://www.w3.org/2000/svg" width="58" height="290" viewBox="0 0 58 290">
  <defs>
    <linearGradient id="leatherV-ref" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40284c"/>
      <stop offset="45%" stop-color="#34203f"/>
      <stop offset="100%" stop-color="#1e1224"/>
    </linearGradient>
    <linearGradient id="leatherH-ref" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1224"/>
      <stop offset="50%" stop-color="#40284c"/>
      <stop offset="100%" stop-color="#1e1224"/>
    </linearGradient>
    <linearGradient id="cyl-ref" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="18%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="82%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.28)"/>
    </linearGradient>
    <linearGradient id="foil-ref" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4e1f"/>
      <stop offset="30%" stop-color="#b98a3e"/>
      <stop offset="50%" stop-color="#f4dd97"/>
      <stop offset="70%" stop-color="#c99a48"/>
      <stop offset="100%" stop-color="#6b4e1f"/>
    </linearGradient>
    <filter id="grain-ref" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.4" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="d"/>
      <feComponentTransfer in="d" result="a">
        <feFuncA type="linear" slope="0.06" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="vig-ref" cx="50%" cy="8%" r="115%">
      <stop offset="0%" stop-color="rgba(255,225,190,0.14)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>
  </defs>

  <rect width="58" height="290" fill="url(#leatherV-ref)" rx="2"/>
  <rect width="58" height="290" fill="url(#leatherH-ref)" rx="2" opacity="0.45"/>
  <rect width="58" height="290" filter="url(#grain-ref)" opacity="0.5" rx="2"/>
  <rect width="58" height="290" fill="url(#cyl-ref)" rx="2"/>

  <!-- top band pair -->
  <g>
    <rect x="5" y="31" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="28" width="48" height="3.5" fill="#40284c"/>
    <rect x="5" y="27.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="5" y="43" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="40" width="48" height="3.5" fill="#40284c"/>
    <rect x="5" y="39.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <!-- bottom band pair -->
  <g>
    <rect x="5" y="250" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="247" width="48" height="3.5" fill="#40284c"/>
    <rect x="5" y="246.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="5" y="262" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="259" width="48" height="3.5" fill="#40284c"/>
    <rect x="5" y="258.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>

  <!-- title REFERENCES -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" text-anchor="middle">
    <g fill="#000" opacity="0.55">
      <text x="29.6" y="64.6">R</text>
      <text x="29.6" y="82.6">E</text>
      <text x="29.6" y="100.6">F</text>
      <text x="29.6" y="118.6">E</text>
      <text x="29.6" y="136.6">R</text>
      <text x="29.6" y="154.6">E</text>
      <text x="29.6" y="172.6">N</text>
      <text x="29.6" y="190.6">C</text>
      <text x="29.6" y="208.6">E</text>
      <text x="29.6" y="226.6">S</text>
    </g>
    <g fill="url(#foil-ref)">
      <text x="29" y="64">R</text>
      <text x="29" y="82">E</text>
      <text x="29" y="100">F</text>
      <text x="29" y="118">E</text>
      <text x="29" y="136">R</text>
      <text x="29" y="154">E</text>
      <text x="29" y="172">N</text>
      <text x="29" y="190">C</text>
      <text x="29" y="208">E</text>
      <text x="29" y="226">S</text>
    </g>
  </g>

  <!-- ornament: small hollow diamond -->
  <rect x="24" y="234" width="10" height="10" fill="none" stroke="url(#foil-ref)" stroke-width="0.9" transform="rotate(45 29 239)" opacity="0.55"/>

  <rect width="58" height="290" fill="url(#vig-ref)" rx="2"/>
</svg>
