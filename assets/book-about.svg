<!--
  book-about.svg - About Book Spine
  WHAT: Aged deep-teal tooled-leather spine, embossed bands, beveled antique-silver "ABOUT"
  WHY:  Visual asset for About book on the bookshelf
-->
<svg xmlns="http://www.w3.org/2000/svg" width="58" height="290" viewBox="0 0 58 290">
  <defs>
    <linearGradient id="leatherV-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20404a"/>
      <stop offset="45%" stop-color="#16323b"/>
      <stop offset="100%" stop-color="#0d2029"/>
    </linearGradient>
    <linearGradient id="leatherH-about" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d2029"/>
      <stop offset="50%" stop-color="#20404a"/>
      <stop offset="100%" stop-color="#0d2029"/>
    </linearGradient>
    <linearGradient id="cyl-about" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="18%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="82%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.28)"/>
    </linearGradient>
    <!-- Antique silver foil -->
    <linearGradient id="foil-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5f66"/>
      <stop offset="30%" stop-color="#9aa0a8"/>
      <stop offset="50%" stop-color="#e8ecf0"/>
      <stop offset="70%" stop-color="#aeb4bc"/>
      <stop offset="100%" stop-color="#5a5f66"/>
    </linearGradient>
    <filter id="grain-about" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.4" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="d"/>
      <feComponentTransfer in="d" result="a">
        <feFuncA type="linear" slope="0.06" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="vig-about" cx="50%" cy="8%" r="115%">
      <stop offset="0%" stop-color="rgba(255,225,190,0.14)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </radialGradient>
  </defs>

  <rect width="58" height="290" fill="url(#leatherV-about)" rx="2"/>
  <rect width="58" height="290" fill="url(#leatherH-about)" rx="2" opacity="0.45"/>
  <rect width="58" height="290" filter="url(#grain-about)" opacity="0.5" rx="2"/>
  <rect width="58" height="290" fill="url(#cyl-about)" rx="2"/>

  <!-- top band pair -->
  <g>
    <rect x="5" y="40" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="37" width="48" height="3.5" fill="#20404a"/>
    <rect x="5" y="36.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="5" y="53" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="50" width="48" height="3.5" fill="#20404a"/>
    <rect x="5" y="49.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <!-- bottom band pair -->
  <g>
    <rect x="5" y="240" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="237" width="48" height="3.5" fill="#20404a"/>
    <rect x="5" y="236.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>
  <g>
    <rect x="5" y="253" width="48" height="1" fill="rgba(0,0,0,0.5)"/>
    <rect x="5" y="250" width="48" height="3.5" fill="#20404a"/>
    <rect x="5" y="249.4" width="48" height="1" fill="rgba(255,240,220,0.18)"/>
  </g>

  <!-- title ABOUT -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">
    <g fill="#000" opacity="0.55">
      <text x="29.6" y="98.6">A</text>
      <text x="29.6" y="128.6">B</text>
      <text x="29.6" y="158.6">O</text>
      <text x="29.6" y="188.6">U</text>
      <text x="29.6" y="218.6">T</text>
    </g>
    <g fill="url(#foil-about)">
      <text x="29" y="98">A</text>
      <text x="29" y="128">B</text>
      <text x="29" y="158">O</text>
      <text x="29" y="188">U</text>
      <text x="29" y="218">T</text>
    </g>
  </g>

  <!-- ornament: thin vertical rule with two terminal dots (below title, above bottom band) -->
  <g stroke="url(#foil-about)" fill="url(#foil-about)" opacity="0.55">
    <line x1="29" y1="228" x2="29" y2="232" stroke-width="0.9"/>
    <circle cx="29" cy="227" r="1.4" stroke="none"/>
    <circle cx="29" cy="233" r="1.4" stroke="none"/>
  </g>

  <rect width="58" height="290" fill="url(#vig-about)" rx="2"/>
</svg>
